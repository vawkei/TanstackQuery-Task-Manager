services:
  mongodb:
    image: mongo:8.2
    volumes:
      - data:/data/db

  redis:
    image: redis:6
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  server1:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    # env_file:
    #   - ./backend/env_dummy
    depends_on:
      - mongodb
      - redis

  server2:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    # env_file:
    #   - ./backend/env_dummy
    depends_on:
      - mongodb
      - redis

  server3:
    build: ./backend
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    # env_file:
    #   - ./backend/env_dummy
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true
    depends_on:
      - server1
      - server2
      - server3

  reverse-proxy:
    build: ./reverse-proxy
    ports:
      - "80:80"
    depends_on:
      - server1
      - server2
      - server3

volumes:
  data:
  redis_data:

