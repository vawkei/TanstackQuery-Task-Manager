services:
  server1:
    build: ./backend
    image: vawkei/server1:latest
    environment:
      - PORT=5000
    env_file:
      - ./backend/env_dummy

  server2:
    build: ./backend
    image: vawkei/server2:latest
    environment:
      - PORT=5000
    env_file:
      - ./backend/env_dummy

  server3:
    build: ./backend
    image: vawkei/server3:latest
    environment:
      - PORT=5000
    env_file:
      - ./backend/env_dummy

  frontend:
    build: ./frontend
    image: vawkei/frontend:latest
    depends_on:
      - server1
      - server2
      - server3

  reverse-proxy:
    build: ./reverse-proxy
    image: vawkei/reverse-proxy:latest
    ports:
      - "80:80"
    depends_on:
      - server1
      - server2
      - server3
